name: Publish to NuGet

on:
  push:
    tags: ['v*.*.*']

# This workflow publishes to NuGet only. It deliberately does NOT create a GitHub release: releases
# are created by hand in the GitHub UI, so that beta and rc tags do not clutter the releases list.
permissions:
  id-token: write # Required for NuGet trusted publishing
  contents: read # Checkout only; nothing is written back to the repository

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for MinVer

      # The same composite action the pull request check runs, so what gets pushed is what was
      # verified. It restores, builds, tests and packs the package project alone — deliberately not
      # the solution, which also holds the TestSite and its full Umbraco instance: a problem there
      # would fail this run after the tag is already public, for a reason unrelated to the package.
      # The action's own checks on the produced .nupkg are the last point at which a bad artifact is
      # still recoverable, because a published version cannot be replaced, only unlisted.
      - uses: ./.github/actions/build-package

      - name: Login to NuGet (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
