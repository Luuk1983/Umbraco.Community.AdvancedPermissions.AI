name: Publish to NuGet

on:
  push:
    tags: ['v*.*.*']

# No GitHub release is created here. Releases are made by hand in the GitHub UI, and only for the
# versions worth listing: a release per tag would fill the list with every beta and rc.
permissions:
  id-token: write # Required for NuGet trusted publishing
  contents: read # Checkout only; this workflow creates no GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for MinVer

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/Umbraco.Community.AdvancedPermissions.AI/ --configuration Release --output ./artifacts

      - name: Login to NuGet (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
