name: CI

# This filter matches the **base** of a pull request, so a branch missing from it gets no checks at
# all rather than failing ones — and the omission is silent, because a pull request with nothing
# configured to run looks exactly like one whose checks have not started yet. `main` is listed
# literally as well as under the glob: whether the trunk gets built is not a thing to settle on a
# subtlety of GitHub's globbing. `*/main` covers the versioned trunks (`v17/main`, and whatever the
# next major adds).
on:
  pull_request:
    branches:
      - main
      - '*/main'

jobs:
  # What ships. Kept identical to the release by sharing one composite action, because the way this
  # goes wrong is a pull request check that quietly stops matching what publishing does.
  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for MinVer

      - uses: ./.github/actions/build-package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          retention-days: 7

  # Everything else: the TestSite, which boots a real Umbraco instance with the Umbraco.AI runtime
  # and the starter kit for manual copilot verification. A separate job on purpose, and never merged
  # into the one above — it contributes nothing to the package, so a problem here is news on a pull
  # request rather than something that should be able to block a release. Running in parallel means
  # it costs no wall-clock against the job that matters.
  solution:
    name: Solution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build --configuration Release
